<style>
  :root{
    --pink:#FF5CA8; --bubble:#FFB3D6; --blush:#FFE1EF; --magenta:#C0136B; --pop:#FFE066; --ink:#2B0A18;
    /* Display: League Spartan, set lowercase. Text and all-caps labels: DM Sans. */
    --display:"League Spartan","Futura","Century Gothic",sans-serif;
    --font:"DM Sans","Helvetica Neue",Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--pink);color:var(--ink);font-family:var(--font);font-size:1.05rem;line-height:1.5;
    background-image:radial-gradient(circle at 20% 10%,rgba(255,255,255,.35) 0 3px,transparent 4px),radial-gradient(circle at 70% 40%,rgba(255,255,255,.3) 0 2px,transparent 3px),radial-gradient(circle at 40% 80%,rgba(255,255,255,.3) 0 3px,transparent 4px);
    background-size:220px 220px,300px 300px,260px 260px}
  img{display:block;max-width:100%;height:auto}
  a{color:inherit}
  :focus-visible{outline:3px solid var(--ink);outline-offset:3px}
  h1,h2,h3{margin:0;line-height:1;font-weight:700}
  h1,h2{font-family:var(--display)}
  p{margin:0 0 1em}

  .ticker{background:var(--ink);color:var(--pop);overflow:hidden;white-space:nowrap;font-weight:500;letter-spacing:.28em;text-transform:uppercase;font-size:.72rem;padding:.6rem 0}
  .ticker span{display:inline-block;padding-right:2rem}
  .ticker-track{display:inline-block;animation:slide 24s linear infinite}
  @keyframes slide{from{transform:translateX(0)}to{transform:translateX(-50%)}}
  @media (prefers-reduced-motion:reduce){.ticker-track{animation:none}}

  .wrap{max-width:980px;margin:0 auto;padding:0 1.25rem}

  .mast{text-align:center;padding:2.5rem 0 1rem}
  .mast-small{font-weight:500;letter-spacing:.32em;text-transform:uppercase;font-size:.78rem;color:var(--ink);opacity:.8;margin-bottom:.9rem}
  .mast h1{font-size:clamp(4rem,17vw,11rem);font-weight:700;text-transform:lowercase;color:var(--ink);letter-spacing:-.035em;line-height:.9}
  .mast-sub{display:flex;justify-content:center;gap:1.6rem;flex-wrap:wrap;font-weight:500;color:var(--ink);opacity:.8;letter-spacing:.32em;text-transform:uppercase;font-size:.78rem;margin-top:1rem}

  .cover{position:relative;max-width:520px;margin:2rem auto 3rem;transform:rotate(-2.5deg)}
  .cover img{border-radius:14px;box-shadow:0 30px 60px rgba(58,11,34,.35)}
  .sticker{position:absolute;right:-1.2rem;top:-1.2rem;width:8.5rem;height:8.5rem;border-radius:50%;background:var(--pop);color:var(--ink);display:grid;place-items:center;text-align:center;font-weight:700;line-height:1.05;transform:rotate(12deg);box-shadow:0 8px 20px rgba(58,11,34,.25);padding:.5rem}
  .sticker strong{display:block;font-family:var(--display);font-weight:700;font-size:2.2rem;letter-spacing:-.02em}
  .sticker small{font-size:.62rem;font-weight:500;letter-spacing:.06em;display:block;margin-top:.2rem}
  .cover-note{text-align:center;font-size:.82rem;color:var(--ink);opacity:.75;margin-top:-1.5rem;margin-bottom:3rem}

  .card{background:#fff;border-radius:26px;padding:clamp(1.5rem,4vw,2.75rem);margin:0 0 1.5rem;box-shadow:0 12px 30px rgba(58,11,34,.15)}
  .card h2{font-size:clamp(1.9rem,4.4vw,2.7rem);font-weight:600;text-transform:lowercase;letter-spacing:-.025em;color:var(--magenta);margin-bottom:1.4rem}
  .features{list-style:none;padding:0;margin:0;display:grid;gap:1.25rem}
  .features li{display:grid;grid-template-columns:auto 1fr;gap:1rem;align-items:start}
  .features .num{width:2.6rem;height:2.6rem;border-radius:50%;background:var(--bubble);display:grid;place-items:center;font-weight:500;font-size:.8rem;letter-spacing:.06em;color:var(--magenta)}
  .features h3{font-family:var(--font);font-weight:700;font-size:1.12rem;letter-spacing:-.005em;color:var(--ink);margin-bottom:.25rem}
  .features p{margin:0;color:#6b3550}

  .shop{display:grid;grid-template-columns:1fr;gap:1rem}
  @media (min-width:640px){.shop{grid-template-columns:repeat(3,1fr)}}
  .product{background:var(--blush);border-radius:18px;padding:1.25rem;position:relative}
  .product h3{font-family:var(--font);font-weight:700;font-size:1.05rem;margin-bottom:.35rem;padding-right:4.9rem;line-height:1.25}
  .product .price{font-weight:700;color:var(--magenta);font-size:1.2rem}
  .product .sold{position:absolute;top:1rem;right:1rem;background:var(--ink);color:#fff;font-size:.62rem;font-weight:500;letter-spacing:.2em;text-transform:uppercase;padding:.32rem .6rem;border-radius:999px;transform:rotate(6deg)}
  .product p{margin:.35rem 0 0;font-size:.95rem;color:#6b3550}

  .subscribe{text-align:center}
  .subscribe .btn{display:inline-block;background:var(--magenta);color:#fff;font-weight:500;text-decoration:none;padding:1.05rem 2.1rem;border-radius:999px;font-size:.8rem;letter-spacing:.24em;text-transform:uppercase;box-shadow:0 8px 0 var(--ink)}
  .subscribe .btn:active{transform:translateY(4px);box-shadow:0 4px 0 var(--ink)}
  .subscribe p:last-child{margin:1rem 0 0;font-size:.9rem;color:#6b3550}

  .foot{text-align:center;color:var(--ink);opacity:.8;font-size:.78rem;padding:3rem 1rem 3rem;letter-spacing:.08em}
  .foot a{color:var(--ink)}
</style>
</head>
<body data-page="lily-land">
<div class="ticker" id="ticker" aria-hidden="true"></div>
<main class="wrap" id="lily"></main>
<footer class="foot" id="lily-foot"></footer>
<script src="site.js"></script>
</body>
</html>
